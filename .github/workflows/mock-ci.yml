name: CI

# simple one

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mock Python tests
        run: |
          echo "Running Python tests..."
          sleep 2
          echo "All Python tests passed!"

  test-typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mock TypeScript tests
        run: |
          echo "Running TypeScript tests..."
          sleep 2
          echo "All TypeScript tests passed!"

  test-cdk-nag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mock CDK Nag checks
        run: |
          echo "Running CDK Nag..."
          sleep 2
          echo "CDK Nag checks passed!"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [test-python, test-typescript, test-cdk-nag]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Mock deploy to staging
        run: echo "Deployed to staging!"

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Mock deploy to prod
        run: echo "Deployed to prod!"
